name: Build desktop and mobile previews
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            command: flutter build linux --release --dart-define-from-file=config/release.json
            path: build/linux/x64/release/bundle/
          - os: windows-latest
            target: windows
            command: flutter build windows --release --dart-define-from-file=config/release.json
            path: build/windows/x64/runner/Release/
          - os: macos-latest
            target: macos
            command: flutter build macos --release --dart-define-from-file=config/release.json
            path: build/macos/Build/Products/Release/
          - os: ubuntu-latest
            target: android
            command: flutter build apk --debug --dart-define-from-file=config/release.json
            path: build/app/outputs/flutter-apk/app-debug.apk
          - os: macos-latest
            target: ios
            command: flutter build ios --release --no-codesign --dart-define-from-file=config/release.json
            path: build/ios/iphoneos/
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - run: flutter pub get
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: azik-${{ matrix.target }}-preview
          path: ${{ matrix.path }}
